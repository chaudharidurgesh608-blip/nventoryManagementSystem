<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Inventory Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-box-seam-fill text-primary fs-3 me-2"></i>
        <span>Inventory Hub</span>
      </a>
      <div id="navbar-auth-section" class="ms-auto d-flex align-items-center"></div>
    </div>
  </nav>

  <!-- Register Container -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="custom-card p-4 p-md-5 shadow-sm">
          <div class="text-center mb-4">
            <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
              <i class="bi bi-person-plus-fill fs-2"></i>
            </div>
            <h3 class="fw-bold">Create Account</h3>
            <p class="text-muted">Register as a user or manager</p>
          </div>

          <!-- Alert placeholder -->
          <div id="alert-box" class="alert d-none" role="alert"></div>

          <!-- Register Form -->
          <form id="registerForm">
            <div class="mb-3">
              <label for="fullName" class="form-label fw-semibold">Full Name</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="fullName" placeholder="e.g. John Doe" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="password" placeholder="At least 6 characters" minlength="6" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="role" class="form-label fw-semibold">Role Selection</label>
              <select class="form-select" id="role">
                <option value="User" selected>Normal User (Limited Access)</option>
                <option value="Admin">Administrator (Full Access)</option>
              </select>
            </div>

            <button type="submit" id="registerBtn" class="btn btn-success w-100 py-2 fw-semibold">
              <span id="btnText"><i class="bi bi-person-check me-2"></i> Register Account</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>

          <hr class="my-4">

          <div class="text-center">
            <p class="mb-0 text-muted">Already have an account? 
              <a href="login.html" class="text-primary fw-semibold text-decoration-none">Sign In</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center py-3">
    <div class="container">
      <small class="text-muted">Inventory Management System • BCA Major Project</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alert-box');
    const registerBtn = document.getElementById('registerBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      alertBox.className = 'alert d-none';
      btnText.classList.add('d-none');
      btnSpinner.classList.remove('d-none');
      registerBtn.disabled = true;

      try {
        const response = await apiRequest('/auth/register', 'POST', { fullName, email, password, role });
        if (response && response.isSuccess) {
          alertBox.className = 'alert alert-success';
          alertBox.innerHTML = '<i class="bi bi-check-circle me-2"></i> Registration successful! Redirecting to login...';
          
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          throw new Error(response?.message || 'Registration failed.');
        }
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.innerHTML = `<i class="bi bi-exclamation-triangle me-2"></i> ${err.message}`;
      } finally {
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
        registerBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
